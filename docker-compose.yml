services:
  postgres:
    image: postgres:17
    container_name: transactions-dispute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transactions_dispute
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d transactions_dispute"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: